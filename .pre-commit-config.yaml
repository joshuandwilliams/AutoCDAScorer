# The package is pure R, so only the R hooks from AutoCDAScorer_Models are used here.
# styler formats the files being committed; lintr reports without blocking, because the
# package predates the linter (see .pre-commit-hooks/lint_check.R).
exclude: ^(man/|inst/extdata/|dev/)

repos:
  - repo: local
    hooks:
      - id: style-files
        name: style-files (styler)
        entry: Rscript .pre-commit-hooks/style_files.R
        language: system
        files: '\.([rR]|[rR]md)$'
      - id: lintr
        name: lintr
        entry: Rscript .pre-commit-hooks/lint_check.R
        language: system
        files: '\.([rR]|[rR]md)$'
