# The package is pure R, so only the R hooks from AutoCDAScorer_Models are used here.
# styler formats the files being committed. lintr fails the commit on any lint.
exclude: ^(man/|inst/extdata/)

repos:
  - repo: local
    hooks:
      - id: style-files
        name: style-files (styler)
        entry: Rscript .pre-commit-hooks/style_files.R
        language: system
        files: '\.([rR]|[rR]md)$'
      - id: lintr
        name: lintr
        entry: Rscript .pre-commit-hooks/lint_check.R
        language: system
        files: '\.([rR]|[rR]md)$'
