name: Lint

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install R lint/style dependencies
        # Pinned to the versions tested locally, as in AutoCDAScorer_Models: an unpinned
        # install let CI pick up a newer lintr with a new default linter, which failed CI
        # despite passing locally.
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_version("styler", version = "1.10.3")'
          Rscript -e 'remotes::install_version("lintr", version = "3.2.0")'
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the lintr hook. pre-commit/action fails the job whenever a hook edits a
      # file, and styler edits files by design, so running it here would demand the
      # whole-package reformat rather than report on it. styler stays a local hook.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: lintr --all-files
